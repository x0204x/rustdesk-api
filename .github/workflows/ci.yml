name: CI

on:
  push:
    branches:
      - develop
      - stable
  pull_request:
    branches:
      - develop
      - stable
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend / Go 1.23.10
    runs-on: ubuntu-24.04

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_REDIS_ADDR: 127.0.0.1:6379
      CGO_ENABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.10"
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Download Go modules
        run: go mod download

      - name: Verify Go modules
        run: go mod verify

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -count=1

      - name: Build linux amd64
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -o dist/apimain-linux-amd64 \
            ./cmd/apimain.go

      - name: Upload amd64 binary
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-api-linux-amd64
          path: dist/apimain-linux-amd64
          if-no-files-found: error
          retention-days: 7

  arm64-build:
    name: Linux ARM64 build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.10"
          cache: true

      - name: Install ARM64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            file

      - name: Download Go modules
        run: go mod download

      - name: Build linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "1"
          CC: aarch64-linux-gnu-gcc
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -o dist/apimain-linux-arm64 \
            ./cmd/apimain.go

      - name: Verify ARM64 binary
        run: |
          file dist/apimain-linux-arm64
          file dist/apimain-linux-arm64 | grep -q "ARM aarch64"

      - name: Upload arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-api-linux-arm64
          path: dist/apimain-linux-arm64
          if-no-files-found: error
          retention-days: 7
  container:
    name: GHCR multi-arch image
    needs:
      - backend-test
      - arm64-build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-api-linux-amd64
          path: dist/amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-api-linux-arm64
          path: dist/arm64

      - name: Verify binaries
        run: |
          test -f dist/amd64/apimain-linux-amd64
          test -f dist/arm64/apimain-linux-arm64
          ls -lh dist/amd64 dist/arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/stable' }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ghcr
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Smoke test amd64 image
        run: |
          docker run --rm \
            --platform linux/amd64 \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            --help | grep -q "RUSTDESK API SERVER"

      - name: Smoke test arm64 image
        run: |
          docker run --rm \
            --platform linux/arm64 \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            --help | grep -q "RUSTDESK API SERVER"
