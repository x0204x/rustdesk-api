name: CI

on:
  push:
    branches:
      - develop
      - stable
  pull_request:
    branches:
      - develop
      - stable
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend / Go 1.27.1
    runs-on: ubuntu-24.04

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_REDIS_ADDR: 127.0.0.1:6379
      CGO_ENABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Verify Go toolchain
        shell: bash
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.27.1"
          test "$(go env GOTOOLCHAIN)" = "local"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Download Go modules
        run: go mod download

      - name: Verify Go modules
        run: go mod verify

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -count=1

      - name: Build linux amd64
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -o dist/apimain-linux-amd64 \
            ./cmd/apimain.go

      - name: Verify module files unchanged
        shell: bash
        run: git diff --exit-code -- go.mod go.sum

      - name: Upload amd64 binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-api-linux-amd64
          path: dist/apimain-linux-amd64
          if-no-files-found: error
          archive: true
          retention-days: 7

  arm64-build:
    name: Linux ARM64 build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Verify Go toolchain
        shell: bash
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.27.1"
          test "$(go env GOTOOLCHAIN)" = "local"

      - name: Install ARM64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            file

      - name: Download Go modules
        run: go mod download

      - name: Build linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "1"
          CC: aarch64-linux-gnu-gcc
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -o dist/apimain-linux-arm64 \
            ./cmd/apimain.go

      - name: Verify ARM64 binary
        run: |
          file dist/apimain-linux-arm64
          file dist/apimain-linux-arm64 | grep -q "ARM aarch64"

      - name: Verify module files unchanged
        shell: bash
        run: git diff --exit-code -- go.mod go.sum

      - name: Upload arm64 binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-api-linux-arm64
          path: dist/apimain-linux-arm64
          if-no-files-found: error
          archive: true
          retention-days: 7
  container:
    name: GHCR multi-arch image
    needs:
      - backend-test
      - arm64-build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate production Compose
        shell: bash
        run: |
          cp deploy/.env.production.example deploy/.env.production
          trap 'rm -f deploy/.env.production' EXIT
          docker compose \
            --env-file deploy/.env.production \
            -f deploy/compose.production.yml \
            config -q

      - name: Download amd64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rustdesk-api-linux-amd64
          path: dist/amd64
          digest-mismatch: error

      - name: Download arm64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rustdesk-api-linux-arm64
          path: dist/arm64
          digest-mismatch: error

      - name: Verify binaries
        run: |
          test -f dist/amd64/apimain-linux-amd64
          test -f dist/arm64/apimain-linux-arm64
          ls -lh dist/amd64 dist/arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/stable' }}

      - name: Build and push multi-arch image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.ghcr
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true

      - name: Inspect published image
        shell: bash
        env:
          SMOKE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: docker buildx imagetools inspect "$SMOKE_IMAGE"

      - name: Runtime smoke test (amd64 and arm64)
        shell: bash
        timeout-minutes: 15
        env:
          SMOKE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: bash .github/scripts/api-runtime-smoke.sh

      - name: RustDesk 1.4.9 API contract
        shell: bash
        timeout-minutes: 10
        env:
          SMOKE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: bash .github/scripts/rustdesk-client-contract-smoke.sh
